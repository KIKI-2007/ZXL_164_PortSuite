name: Minecraft 1.6.4 Forge Build

concurrency:
  group: forge164-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ZXL_164_PortSuite/**'
      - '.github/workflows/forge164-build.yml'

permissions:
  contents: write

jobs:
  forge-build:
    name: JDK 8 + Gradle 2.14.1 + ForgeGradle 1.0
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install exact Gradle 2.14.1 distribution
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-2.14.1-bin.zip --output /tmp/gradle-2.14.1-bin.zip
          unzip -q /tmp/gradle-2.14.1-bin.zip -d /opt
          echo "/opt/gradle-2.14.1/bin" >> "$GITHUB_PATH"

      - name: Print toolchain versions
        run: |
          java -version
          gradle --version

      - name: Seed legacy Minecraft 1.6.4 jars into ForgeGradle cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request

          manifest_url = "https://piston-meta.mojang.com/mc/game/version_manifest_v2.json"
          with urllib.request.urlopen(manifest_url, timeout=30) as response:
              manifest = json.load(response)
          version = next(item for item in manifest["versions"] if item["id"] == "1.6.4")
          with urllib.request.urlopen(version["url"], timeout=30) as response:
              metadata = json.load(response)

          cache = pathlib.Path.home() / ".gradle/caches/minecraft/net/minecraft"
          targets = {
              "client": cache / "minecraft/1.6.4/minecraft-1.6.4.jar",
              "server": cache / "minecraft_server/1.6.4/minecraft_server-1.6.4.jar",
          }
          for kind, target in targets.items():
              target.parent.mkdir(parents=True, exist_ok=True)
              url = metadata["downloads"][kind]["url"]
              request = urllib.request.Request(url, headers={"User-Agent": "ZXL-164-PortSuite-CI"})
              with urllib.request.urlopen(request, timeout=60) as response, target.open("wb") as output:
                  output.write(response.read())
              print(f"Seeded {kind}: {target} ({target.stat().st_size} bytes)")
          PY

      - name: Build all five Forge 1.6.4 modules
        working-directory: ZXL_164_PortSuite
        run: gradle clean build --no-daemon --stacktrace

      - name: Verify produced JAR files
        if: success()
        working-directory: ZXL_164_PortSuite
        shell: bash
        run: |
          set -euo pipefail
          find . -path '*/build/libs/*.jar' -type f -print
          count="$(find . -path '*/build/libs/*.jar' -type f | wc -l)"
          test "$count" -ge 5

      - name: Publish five JARs into the GitHub repository
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          VERSION="forge-9.11.1.964"
          DEST="releases/$VERSION"
          mkdir -p "$DEST"
          find ZXL_164_PortSuite -path '*/build/libs/*.jar' -type f -exec cp {} "$DEST/" \;
          test "$(find "$DEST" -maxdepth 1 -name '*.jar' -type f | wc -l)" -eq 5
          (cd "$DEST" && zip -q "ZXL_164_PortSuite_Alpha_$VERSION.zip" ./*.jar)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "Publish five Alpha mod JARs for Minecraft 1.6.4 Forge 9.11.1.964"
            git push
          fi

      - name: Upload build outputs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-1.6.4-Forge-Build
          path: |
            ZXL_164_PortSuite/**/build/libs/*.jar
            ZXL_164_PortSuite/**/build/reports/**
          if-no-files-found: warn
