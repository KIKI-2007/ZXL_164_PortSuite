name: Legacy core checks

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-smoke:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Extract committed source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _source
          tar -xzf source/ZXL_164_PortSuite.tar.gz -C _source
          test -f _source/ZXL_164_PortSuite/scripts/compile-core.sh

      - name: Run Java 8 core smoke checks
        shell: bash
        run: |
          set -euo pipefail
          cd _source/ZXL_164_PortSuite
          bash scripts/compile-core.sh

      - name: Publish browsable source tree
        shell: bash
        run: |
          set -euo pipefail
          cp -a _source/ZXL_164_PortSuite ./ZXL_164_PortSuite
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ZXL_164_PortSuite
          if git diff --cached --quiet; then
            echo "Source tree is already published."
            exit 0
          fi
          git commit -m "Publish extracted ZXL 1.6.4 source tree"
          git push

      - name: Upload smoke-check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-smoke-classes
          path: _source/ZXL_164_PortSuite/build-core-check
          if-no-files-found: ignore
