name: Legacy core checks

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  core-smoke:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download source archive through Microsoft Graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _source
          curl --fail --location --retry 3 --output _source/source.tar.gz 'https://graph.microsoft.com/v1.0/shares/u!aHR0cHM6Ly8xZHJ2Lm1zL3UvYy83ODM5M2VmZWUxZTdhNDU0L0lRQnBLNlhlanRIU1NhcWNtOEdFNjhtaUFWcl80d1Fsd1A0MUZpUzF2R2p3RGdR/driveItem/content'
          tar -xzf _source/source.tar.gz -C _source
          test -f _source/ZXL_164_PortSuite/scripts/compile-core.sh

      - name: Run Java 8 core smoke checks
        shell: bash
        run: |
          set -euo pipefail
          cd _source/ZXL_164_PortSuite
          bash scripts/compile-core.sh

      - name: Upload smoke-check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-smoke-classes
          path: _source/ZXL_164_PortSuite/build-core-check
          if-no-files-found: ignore
