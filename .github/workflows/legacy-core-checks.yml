name: Legacy core checks

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  core-smoke:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Extract committed source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _source
          tar -xzf source/ZXL_164_PortSuite.tar.gz -C _source
          test -f _source/ZXL_164_PortSuite/scripts/compile-core.sh

      - name: Run Java 8 core smoke checks
        shell: bash
        run: |
          set -euo pipefail
          cd _source/ZXL_164_PortSuite
          bash scripts/compile-core.sh

      - name: Upload smoke-check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-smoke-classes
          path: _source/ZXL_164_PortSuite/build-core-check
          if-no-files-found: ignore
